<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Course Management | Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #FFFFFF;
      color: #000000;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Navigation Container */
    #sidebar-container {
      display: contents;
    }

    aside {
      width: 260px;
      background: #FFFFFF;
      border-right: 2px solid #0047AB;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      flex-shrink: 0;
    }

    .sidebar-brand h2 {
      font-size: 1.4rem;
      color: #0047AB;
      margin-bottom: 6px;
    }

    .sidebar-brand p {
      font-size: 0.85rem;
      color: #555555;
    }

    .sidebar-menu {
      list-style: none;
      margin-top: 30px;
      flex-grow: 1;
    }

    .sidebar-menu li {
      margin-bottom: 12px;
    }

    .sidebar-menu a {
      display: block;
      padding: 10px 14px;
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: #0047AB;
      color: #FFFFFF;
    }

    .logout-btn {
      display: block;
      padding: 10px 14px;
      background: #FFFFFF;
      color: #0047AB;
      border: 1px solid #0047AB;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #0047AB;
      color: #FFFFFF;
    }

    /* Main Content Area */
    main {
      flex-grow: 1;
      padding: 30px 40px;
      background: #FFFFFF;
      overflow-y: auto;
      min-width: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 15px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #000000;
    }

    .admin-profile-badge {
      font-size: 0.9rem;
      color: #555555;
      font-weight: 600;
    }

    /* Form Container Card */
    .form-card {
      background: #FFFFFF;
      border: 2px solid #0047AB;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 35px;
      box-shadow: 0 4px 12px rgba(0, 71, 171, 0.06);
    }

    .form-card h3 {
      font-size: 1.2rem;
      color: #0047AB;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #000000;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #FFFFFF;
      color: #000000;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #0047AB;
    }

    .btn-primary {
      padding: 10px 24px;
      background: #0047AB;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #003380;
    }

    .btn-primary:disabled {
      background: #7a9ad0;
      cursor: not-allowed;
    }

    .form-submit-container {
      text-align: right;
    }

    /* Tables */
    .section-title {
      font-size: 1.3rem;
      color: #000000;
      margin-bottom: 15px;
      font-weight: 600;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #FFFFFF;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      font-size: 0.9rem;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: #0047AB;
      color: #FFFFFF;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    tr:hover {
      background: #f1f5f9;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .edit-btn {
      padding: 6px 12px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .edit-btn:hover {
      background: #dbeafe;
    }

    .delete-btn {
      padding: 6px 12px;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    /* Modal / Popup Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease-in-out;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #FFFFFF;
      border: 2px solid #0047AB;
      border-radius: 12px;
      width: 100%;
      max-width: 500px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 10px;
    }

    .modal-header h3 {
      font-size: 1.2rem;
      color: #0047AB;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      color: #555555;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #000000;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-secondary {
      padding: 10px 20px;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

  <!-- Admin Sidebar Insertion Point -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main>
    <header>
      <h1>Course Management</h1>
      <div class="admin-profile-badge">Role: <span data-user="title"></span> | ID: <span data-user="id"></span></div>
    </header>

    <!-- Create Course Form Card -->
    <div class="form-card">
      <h3>Add New Academic Program / Course</h3>
      <div class="form-grid">
        <div class="form-group">
          <label for="courseCode">Course Code / Acronym</label>
          <input type="text" id="courseCode" placeholder="e.g. BCA, MCA, BBA, B.Tech">
        </div>
        <div class="form-group">
          <label for="courseName">Full Course Name</label>
          <input type="text" id="courseName" placeholder="e.g. Bachelor of Computer Applications">
        </div>
        <div class="form-group">
          <label for="durationSelect">Duration</label>
          <select id="durationSelect">
            <option value="3 Years">3 Years (UG)</option>
            <option value="4 Years">4 Years (B.Tech / Professional)</option>
            <option value="2 Years">2 Years (PG)</option>
            <option value="1 Year">1 Year (Diploma)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="semestersSelect">Total Semesters</label>
          <select id="semestersSelect">
            <option value="6">6 Semesters</option>
            <option value="8">8 Semesters</option>
            <option value="4">4 Semesters</option>
            <option value="2">2 Semesters</option>
          </select>
        </div>
      </div>
      <div class="form-submit-container">
        <button type="button" class="btn-primary" id="createCourseBtn">Create Course</button>
      </div>
    </div>

    <!-- Existing Courses Table -->
    <div class="section-title">Active Courses Directory</div>
    <table>
      <thead>
        <tr>
          <th>Course Code</th>
          <th>Course Title</th>
          <th>Duration</th>
          <th>Semesters</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="courseTableBody"></tbody>
    </table>
  </main>

  <!-- Edit Course Modal Popup -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Edit Course Details</h3>
        <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <input type="hidden" id="editCourseId">
      <div class="modal-grid">
        <div class="form-group">
          <label for="editCourseCode">Course Code / Acronym</label>
          <input type="text" id="editCourseCode">
        </div>
        <div class="form-group">
          <label for="editCourseName">Full Course Name</label>
          <input type="text" id="editCourseName">
        </div>
        <div class="form-group">
          <label for="editDurationSelect">Duration</label>
          <select id="editDurationSelect">
            <option value="3 Years">3 Years</option>
            <option value="4 Years">4 Years</option>
            <option value="2 Years">2 Years</option>
            <option value="1 Year">1 Year</option>
          </select>
        </div>
        <div class="form-group">
          <label for="editSemestersSelect">Total Semesters</label>
          <select id="editSemestersSelect">
            <option value="6">6 Semesters</option>
            <option value="8">8 Semesters</option>
            <option value="4">4 Semesters</option>
            <option value="2">2 Semesters</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
        <button type="button" class="btn-primary" id="saveModalBtn">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="/components/portal.js"></script>
  <script>
    initPortal({ sidebar: '/components/admin-sidebar.html', role: 'admin', defaultPage: 'courses.html' });

    let coursesCache = [];
    const $ = id => document.getElementById(id);

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function api(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/auth/login.html';
        throw new Error('Session expired');
      }
      let data;
      try { data = await res.json(); }
      catch { throw new Error('Unexpected server response (' + res.status + ')'); }
      return data;
    }

    async function loadCourses() {
      const tbody = $('courseTableBody');
      try {
        const data = await api('/api/courses');
        if (!data.success) {
          alert(data.message || 'Failed to load courses.');
          return;
        }
        coursesCache = data.courses;

        if (!coursesCache.length) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#666;">No courses added yet. Create one above.</td></tr>';
          return;
        }

        tbody.innerHTML = coursesCache.map(c => `
          <tr>
            <td><strong>${esc(c.course_code)}</strong></td>
            <td>${esc(c.course_name)}</td>
            <td>${esc(c.duration)}</td>
            <td>${esc(c.total_semesters)} Semesters</td>
            <td>
              <div class="action-btns">
                <button type="button" class="edit-btn" data-action="edit" data-id="${c.id}">Edit</button>
                <button type="button" class="delete-btn" data-action="delete" data-id="${c.id}">Delete</button>
              </div>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Error loading courses:', err);
      }
    }

    async function addCourse() {
      const course_code = $('courseCode').value.trim();
      const course_name = $('courseName').value.trim();
      const duration = $('durationSelect').value;
      const total_semesters = $('semestersSelect').value;

      if (!course_code || !course_name) {
        alert('Please fill in all course fields.');
        return;
      }

      const btn = $('createCourseBtn');
      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const result = await api('/api/courses', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_code, course_name, duration, total_semesters })
        });
        if (result.success) {
          alert(result.message);
          $('courseCode').value = '';
          $('courseName').value = '';
          await loadCourses();
        } else {
          alert(result.message || 'Failed to create course.');
        }
      } catch (err) {
        console.error('Error creating course:', err);
        alert(err.message || 'Server communication error.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Course';
      }
    }

    function openEditModal(course) {
      $('editCourseId').value = course.id;
      $('editCourseCode').value = course.course_code;
      $('editCourseName').value = course.course_name;
      $('editDurationSelect').value = course.duration;
      $('editSemestersSelect').value = String(course.total_semesters);
      $('editModal').classList.add('active');
    }

    function closeEditModal() {
      $('editModal').classList.remove('active');
      $('editCourseId').value = '';
    }

    async function saveModalChanges() {
      const courseId = $('editCourseId').value;
      if (!courseId) return;

      const course_code = $('editCourseCode').value.trim();
      const course_name = $('editCourseName').value.trim();
      const duration = $('editDurationSelect').value;
      const total_semesters = $('editSemestersSelect').value;

      if (!course_code || !course_name) {
        alert('Course Code and Full Name cannot be empty.');
        return;
      }

      const btn = $('saveModalBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const result = await api(`/api/courses/${courseId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ course_code, course_name, duration, total_semesters })
        });
        if (result.success) {
          alert(result.message);
          closeEditModal();
          await loadCourses();
        } else {
          alert(result.message || 'Failed to update course.');
        }
      } catch (err) {
        console.error('Error updating course:', err);
        alert(err.message || 'Server communication error.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      }
    }

    async function deleteCourse(courseId) {
      if (!confirm('Are you sure you want to delete this course?')) return;
      try {
        const result = await api(`/api/courses/${courseId}`, { method: 'DELETE' });
        if (result.success) {
          await loadCourses();
        } else {
          alert(result.message || 'Failed to delete course.');
        }
      } catch (err) {
        console.error('Error deleting course:', err);
        alert(err.message);
      }
    }

    $('createCourseBtn').addEventListener('click', addCourse);
    $('closeModalBtn').addEventListener('click', closeEditModal);
    $('cancelModalBtn').addEventListener('click', closeEditModal);
    $('saveModalBtn').addEventListener('click', saveModalChanges);

    $('courseTableBody').addEventListener('click', e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      if (btn.dataset.action === 'edit') {
        const course = coursesCache.find(c => c.id === id);
        if (course) openEditModal(course);
      } else if (btn.dataset.action === 'delete') {
        deleteCourse(id);
      }
    });

    loadCourses();
  </script>
</body>
</html>
