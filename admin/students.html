<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Student Management | Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #FFFFFF;
      color: #000000;
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar Navigation Container */
    #sidebar-container {
      display: contents;
    }

    aside {
      width: 260px;
      background: #FFFFFF;
      border-right: 2px solid #0047AB;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      flex-shrink: 0;
    }

    .sidebar-brand h2 {
      font-size: 1.4rem;
      color: #0047AB;
      margin-bottom: 6px;
    }

    .sidebar-brand p {
      font-size: 0.85rem;
      color: #555555;
    }

    .sidebar-menu {
      list-style: none;
      margin-top: 30px;
      flex-grow: 1;
    }

    .sidebar-menu li {
      margin-bottom: 12px;
    }

    .sidebar-menu a {
      display: block;
      padding: 10px 14px;
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: #0047AB;
      color: #FFFFFF;
    }

    .logout-btn {
      display: block;
      padding: 10px 14px;
      background: #FFFFFF;
      color: #0047AB;
      border: 1px solid #0047AB;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #0047AB;
      color: #FFFFFF;
    }

    /* Main Content Area */
    main {
      flex-grow: 1;
      padding: 30px 40px;
      background: #FFFFFF;
      overflow-y: auto;
      min-width: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 15px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #000000;
    }

    .admin-profile-badge {
      font-size: 0.9rem;
      color: #555555;
      font-weight: 600;
    }

    /* Form Container Card */
    .form-card {
      background: #FFFFFF;
      border: 2px solid #0047AB;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 35px;
      box-shadow: 0 4px 12px rgba(0, 71, 171, 0.06);
    }

    .form-card h3 {
      font-size: 1.2rem;
      color: #0047AB;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #000000;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #FFFFFF;
      color: #000000;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #0047AB;
    }

    .form-group input:disabled {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-primary {
      padding: 10px 24px;
      background: #0047AB;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #003380;
    }

    .btn-primary:disabled {
      background: #7a9ad0;
      cursor: not-allowed;
    }

    .btn-secondary {
      padding: 10px 20px;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    .form-submit-container {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Course Cards Grid */
    .section-title {
      font-size: 1.3rem;
      color: #000000;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .course-card {
      background: #FFFFFF;
      border: 2px solid #0047AB;
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 71, 171, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .course-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 71, 171, 0.12);
      background: #f8fafc;
    }

    .course-card h3 {
      font-size: 1.3rem;
      color: #0047AB;
      margin-bottom: 8px;
    }

    .course-card p {
      color: #555555;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .empty-courses-notice {
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      color: #475569;
    }

    .empty-courses-notice a {
      color: #0047AB;
      font-weight: 600;
      text-decoration: none;
    }

    .empty-courses-notice a:hover {
      text-decoration: underline;
    }

    /* View Container Switcher */
    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }

    .back-btn {
      background: #e2e8f0;
      color: #1e293b;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .back-btn:hover {
      background: #cbd5e1;
    }

    /* Semester Accordion / Tabs */
    .semester-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .semester-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .semester-header h4 {
      font-size: 1.1rem;
      color: #0047AB;
    }

    .btn-promote {
      padding: 6px 12px;
      background: #10b981;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-promote:hover {
      background: #059669;
    }

    .action-btns {
      display: flex;
      gap: 6px;
    }

    .edit-btn {
      padding: 6px 10px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .edit-btn:hover {
      background: #dbeafe;
    }

    .delete-btn {
      padding: 6px 10px;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #FFFFFF;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 14px;
      text-align: left;
      font-size: 0.85rem;
      border-bottom: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    th {
      background: #0047AB;
      color: #FFFFFF;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    .student-photo {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #0047AB;
    }
  </style>
</head>
<body>

  <!-- Admin Sidebar Insertion Point -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main>
    <header>
      <h1>Student Management Portal</h1>
      <div class="admin-profile-badge">Role: <span data-user="title"></span> | ID: <span data-user="id"></span></div>
    </header>

    <!-- VIEW 1: Main Dashboard (Add/Edit Student & Course List) -->
    <div id="mainDashboardView" class="view-section active">

      <!-- Add / Edit Student Form Card -->
      <div class="form-card">
        <h3 id="formTitle">Register New Student</h3>
        <input type="hidden" id="editingId" value="">
        <div class="form-grid">
          <div class="form-group">
            <label for="studentRegNo">Registration No</label>
            <input type="text" id="studentRegNo" placeholder="e.g. STU12349">
          </div>
          <div class="form-group">
            <label for="studentPassword">Login Password</label>
            <input type="password" id="studentPassword" placeholder="Set login password" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="studentName">Full Name</label>
            <input type="text" id="studentName" placeholder="e.g. Alex Mercer">
          </div>
          <div class="form-group">
            <label for="studentCourse">Select Course</label>
            <select id="studentCourse">
              <option value="">Loading courses...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="studentSem">Initial Semester</label>
            <select id="studentSem">
              <option value="1">Semester 1</option>
            </select>
          </div>
          <div class="form-group">
            <label for="studentGender">Gender</label>
            <select id="studentGender">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="studentDob">Date of Birth</label>
            <input type="date" id="studentDob" value="2005-05-14">
          </div>
          <div class="form-group">
            <label for="studentFather">Father's Name</label>
            <input type="text" id="studentFather" placeholder="Father's full name">
          </div>
          <div class="form-group">
            <label for="studentMother">Mother's Name</label>
            <input type="text" id="studentMother" placeholder="Mother's full name">
          </div>
          <div class="form-group">
            <label for="studentPhone">Phone Number</label>
            <input type="text" id="studentPhone" placeholder="+91 98765 43210">
          </div>
          <div class="form-group">
            <label for="studentEmail">Email Address</label>
            <input type="email" id="studentEmail" placeholder="student@portal.edu">
          </div>
          <div class="form-group">
            <label for="studentAadhaar">Aadhaar Number</label>
            <input type="text" id="studentAadhaar" placeholder="12-digit Aadhaar number">
          </div>
          <div class="form-group">
            <label for="studentPhoto">Upload Photo (optional)</label>
            <input type="file" id="studentPhoto" accept="image/*">
          </div>
        </div>
        <div class="form-submit-container">
          <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
          <button type="button" class="btn-primary" id="submitBtn">Register Student</button>
        </div>
      </div>

      <!-- Dynamic Course Selection Cards -->
      <div class="section-title">Select Course to View Semesters &amp; Students</div>
      <div class="courses-grid" id="coursesGrid"></div>

    </div>

    <!-- VIEW 2: Course Semesters & Promotion View -->
    <div id="courseSemestersView" class="view-section">
      <button type="button" class="back-btn" id="backToCoursesBtn">&larr; Back to Courses</button>
      <div class="section-title" id="courseViewTitle">Course Semesters</div>

      <!-- Semesters container populated via JavaScript -->
      <div id="semestersContainer"></div>
    </div>

  </main>

  <script src="/components/portal.js"></script>
  <script>
    initPortal({ sidebar: '/components/admin-sidebar.html', role: 'admin', defaultPage: 'students.html' });

    const FALLBACK_PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36"><rect width="36" height="36" fill="#dbe7f7"/>' +
      '<circle cx="18" cy="13" r="6" fill="#0047AB"/><rect x="7" y="22" width="22" height="11" rx="5" fill="#0047AB"/></svg>');

    let coursesCache = [];
    let studentsCache = [];
    let currentSelectedCourse = '';
    const $ = id => document.getElementById(id);

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    const show = v => (v === null || v === undefined || v === '') ? '-' : esc(v);

    async function api(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/auth/login.html';
        throw new Error('Session expired');
      }
      let data;
      try { data = await res.json(); }
      catch { throw new Error('Unexpected server response (' + res.status + ')'); }
      return data;
    }

    function syncSemesterDropdown(selectedCourseCode, preserveSem = null) {
      const semSelect = $('studentSem');
      const courseObj = coursesCache.find(c => c.course_code === selectedCourseCode);
      const totalSems = courseObj ? Number(courseObj.total_semesters) : 1;

      let opts = '';
      for (let i = 1; i <= totalSems; i++) {
        opts += `<option value="${i}">Semester ${i}</option>`;
      }
      semSelect.innerHTML = opts;

      if (preserveSem && Number(preserveSem) <= totalSems) {
        semSelect.value = String(preserveSem);
      }
    }

    function renderCourseOptionsAndCards() {
      const courseSelect = $('studentCourse');
      const coursesGrid = $('coursesGrid');
      const submitBtn = $('submitBtn');

      if (!coursesCache.length) {
        courseSelect.innerHTML = '<option value="">-- No courses created yet --</option>';
        courseSelect.disabled = true;
        $('studentSem').innerHTML = '<option value="1">Semester 1</option>';
        submitBtn.disabled = true;
        coursesGrid.innerHTML = `
          <div class="empty-courses-notice">
            No courses have been created yet. Please go to <a href="courses.html">Course Catalog</a> to add a course first.
          </div>`;
        return;
      }

      courseSelect.disabled = false;
      submitBtn.disabled = false;

      const previousCourse = courseSelect.value;
      courseSelect.innerHTML = coursesCache.map(c =>
        `<option value="${esc(c.course_code)}">${esc(c.course_code)} (${esc(c.course_name)})</option>`
      ).join('');

      if (previousCourse && coursesCache.some(c => c.course_code === previousCourse)) {
        courseSelect.value = previousCourse;
      }
      syncSemesterDropdown(courseSelect.value, $('studentSem').value);

      coursesGrid.innerHTML = coursesCache.map(c => {
        const count = studentsCache.filter(s => s.course === c.course_code).length;
        return `
          <div class="course-card" data-course="${esc(c.course_code)}">
            <h3>${esc(c.course_code)}</h3>
            <p>${esc(c.course_name)}</p>
            <p><strong>${esc(c.total_semesters)} Semesters &bull; ${count} Student${count === 1 ? '' : 's'}</strong></p>
          </div>`;
      }).join('');
    }

    async function loadData() {
      try {
        const [courseRes, studentRes] = await Promise.all([
          api('/api/courses'),
          api('/api/students')
        ]);

        if (!courseRes.success) {
          alert(courseRes.message || 'Failed to load courses.');
          return;
        }
        if (!studentRes.success) {
          alert(studentRes.message || 'Failed to load students.');
          return;
        }

        coursesCache = courseRes.courses;
        studentsCache = studentRes.students;
        renderCourseOptionsAndCards();

        if (currentSelectedCourse) {
          renderSemesters(currentSelectedCourse);
        }
      } catch (err) {
        console.error('Error loading portal data:', err);
      }
    }

    async function saveStudent() {
      const editingId = $('editingId').value;
      const registration_no = $('studentRegNo').value.trim();
      const password = $('studentPassword').value.trim();
      const full_name = $('studentName').value.trim();
      const course = $('studentCourse').value;
      const email = $('studentEmail').value.trim();

      if (!course) {
        alert('Please create a course in Course Catalog before registering students.');
        return;
      }
      if (!registration_no || !full_name || (!editingId && !password)) {
        alert('Please fill in Registration No, Password, and Full Name.');
        return;
      }
      if (email && !/^\S+@\S+\.\S+$/.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }

      const fd = new FormData();
      fd.append('registration_no', registration_no);
      fd.append('password', password);
      fd.append('full_name', full_name);
      fd.append('course', course);
      fd.append('semester', $('studentSem').value);
      fd.append('gender', $('studentGender').value);
      fd.append('dob', $('studentDob').value);
      fd.append('father_name', $('studentFather').value.trim());
      fd.append('mother_name', $('studentMother').value.trim());
      fd.append('phone', $('studentPhone').value.trim());
      fd.append('email', email);
      fd.append('aadhaar', $('studentAadhaar').value.trim());

      const photo = $('studentPhoto').files[0];
      if (photo) fd.append('photo', photo);

      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const url = editingId ? `/api/students/${editingId}` : '/api/students';
        const result = await api(url, { method: editingId ? 'PUT' : 'POST', body: fd });
        if (result.success) {
          alert(result.message);
          resetForm();
          await loadData();
        } else {
          alert(result.message || 'Operation failed.');
        }
      } catch (err) {
        console.error('Error saving student:', err);
        alert(err.message || 'Server communication error.');
      } finally {
        btn.disabled = coursesCache.length === 0;
        btn.textContent = $('editingId').value ? 'Update Student' : 'Register Student';
      }
    }

    function editStudent(stu) {
      $('editingId').value = stu.id;
      $('studentRegNo').value = stu.registration_no || '';
      $('studentRegNo').disabled = true;
      $('studentPassword').value = '';
      $('studentPassword').placeholder = 'Leave blank to keep existing password';
      $('studentName').value = stu.full_name || '';

      if (coursesCache.some(c => c.course_code === stu.course)) {
        $('studentCourse').value = stu.course;
      }
      syncSemesterDropdown($('studentCourse').value, stu.semester || 1);

      $('studentGender').value = stu.gender || 'Male';
      $('studentDob').value = stu.dob || '';
      $('studentFather').value = stu.father_name || '';
      $('studentMother').value = stu.mother_name || '';
      $('studentPhone').value = stu.phone || '';
      $('studentEmail').value = stu.email || '';
      $('studentAadhaar').value = stu.aadhaar || '';
      $('studentPhoto').value = '';

      $('formTitle').textContent = 'Edit Student Record';
      $('submitBtn').textContent = 'Update Student';
      $('cancelBtn').style.display = 'inline-block';

      goBackToDashboard();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteStudent(stuId) {
      if (!confirm('Are you sure you want to delete this student?')) return;
      try {
        const result = await api(`/api/students/${stuId}`, { method: 'DELETE' });
        if (result.success) {
          await loadData();
        } else {
          alert(result.message || 'Failed to delete student.');
        }
      } catch (err) {
        console.error('Error deleting student:', err);
        alert(err.message);
      }
    }

    function resetForm() {
      $('editingId').value = '';
      $('studentRegNo').value = '';
      $('studentRegNo').disabled = false;
      $('studentPassword').value = '';
      $('studentPassword').placeholder = 'Set login password';
      $('studentName').value = '';
      if (coursesCache.length) {
        $('studentCourse').selectedIndex = 0;
        syncSemesterDropdown($('studentCourse').value, 1);
      }
      $('studentGender').selectedIndex = 0;
      $('studentDob').value = '2005-05-14';
      $('studentFather').value = '';
      $('studentMother').value = '';
      $('studentPhone').value = '';
      $('studentEmail').value = '';
      $('studentAadhaar').value = '';
      $('studentPhoto').value = '';

      $('formTitle').textContent = 'Register New Student';
      $('submitBtn').textContent = 'Register Student';
      $('cancelBtn').style.display = 'none';
    }

    function openCourseView(courseCode) {
      currentSelectedCourse = courseCode;
      $('mainDashboardView').classList.remove('active');
      $('courseSemestersView').classList.add('active');
      $('courseViewTitle').textContent = `Semesters & Students for ${courseCode}`;
      renderSemesters(courseCode);
    }

    function goBackToDashboard() {
      currentSelectedCourse = '';
      $('courseSemestersView').classList.remove('active');
      $('mainDashboardView').classList.add('active');
    }

    function renderSemesters(courseCode) {
      const container = $('semestersContainer');
      container.innerHTML = '';

      const courseObj = coursesCache.find(c => c.course_code === courseCode);
      const totalSems = courseObj ? Number(courseObj.total_semesters) : 6;

      for (let s = 1; s <= totalSems; s++) {
        const semStudents = studentsCache.filter(
          st => st.course === courseCode && Number(st.semester) === s
        );

        let tableRows = '';
        if (semStudents.length === 0) {
          tableRows = `<tr><td colspan="11" style="text-align: center; color: #666;">No students enrolled in Semester ${s}.</td></tr>`;
        } else {
          tableRows = semStudents.map(st => {
            const photo = (st.photo && !st.photo.includes('via.placeholder.com')) ? st.photo : FALLBACK_PHOTO;
            const promoteBtn = s < totalSems
              ? `<button type="button" class="btn-promote" data-action="promote" data-id="${st.id}" data-max="${totalSems}">Promote &rarr;</button>`
              : '';
            return `
              <tr>
                <td><img src="${esc(photo)}" alt="Photo" class="student-photo"></td>
                <td><code>${show(st.registration_no)}</code></td>
                <td><strong>${show(st.full_name)}</strong></td>
                <td>${show(st.gender)}</td>
                <td>${show(st.dob)}</td>
                <td>${show(st.father_name)}</td>
                <td>${show(st.mother_name)}</td>
                <td>${show(st.phone)}</td>
                <td>${show(st.email)}</td>
                <td>${show(st.aadhaar)}</td>
                <td>
                  <div class="action-btns">
                    ${promoteBtn}
                    <button type="button" class="edit-btn" data-action="edit" data-id="${st.id}">Edit</button>
                    <button type="button" class="delete-btn" data-action="delete" data-id="${st.id}">Delete</button>
                  </div>
                </td>
              </tr>`;
          }).join('');
        }

        const semBox = document.createElement('div');
        semBox.className = 'semester-box';
        const bulkPromoteBtn = (semStudents.length > 0 && s < totalSems)
          ? `<button type="button" class="btn-promote" data-action="promote-sem" data-sem="${s}" data-max="${totalSems}">Promote Entire Semester</button>`
          : '';

        semBox.innerHTML = `
          <div class="semester-header">
            <h4>Semester ${s} (${semStudents.length} Student${semStudents.length === 1 ? '' : 's'})</h4>
            ${bulkPromoteBtn}
          </div>
          <table>
            <thead>
              <tr>
                <th>Photo</th>
                <th>Reg No</th>
                <th>Name</th>
                <th>Gender</th>
                <th>DOB</th>
                <th>Father's Name</th>
                <th>Mother's Name</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Aadhaar</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
            </tbody>
          </table>
        `;
        container.appendChild(semBox);
      }
    }

    async function promoteStudent(studentId, maxSems) {
      try {
        const result = await api(`/api/students/${studentId}/promote`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ max_sems: maxSems })
        });
        if (result.success) {
          alert(result.message);
          await loadData();
        } else {
          alert(result.message || 'Promotion failed.');
        }
      } catch (err) {
        console.error('Error promoting student:', err);
        alert(err.message);
      }
    }

    async function promoteEntireSemester(currentSem, maxSems) {
      if (!confirm(`Promote all students in ${currentSelectedCourse} Semester ${currentSem} to Semester ${currentSem + 1}?`)) return;
      try {
        const result = await api('/api/students/promote-semester', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            course: currentSelectedCourse,
            semester: currentSem,
            max_sems: maxSems
          })
        });
        if (result.success) {
          alert(result.message);
          await loadData();
        } else {
          alert(result.message || 'Bulk promotion failed.');
        }
      } catch (err) {
        console.error('Error promoting semester:', err);
        alert(err.message);
      }
    }

    // Event Listeners
    $('studentCourse').addEventListener('change', e => syncSemesterDropdown(e.target.value));
    $('submitBtn').addEventListener('click', saveStudent);
    $('cancelBtn').addEventListener('click', resetForm);
    $('backToCoursesBtn').addEventListener('click', goBackToDashboard);

    $('coursesGrid').addEventListener('click', e => {
      const card = e.target.closest('.course-card[data-course]');
      if (card) openCourseView(card.dataset.course);
    });

    $('semestersContainer').addEventListener('click', e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;

      if (action === 'promote-sem') {
        promoteEntireSemester(Number(btn.dataset.sem), Number(btn.dataset.max));
        return;
      }

      const id = Number(btn.dataset.id);
      if (action === 'promote') {
        promoteStudent(id, Number(btn.dataset.max));
      } else if (action === 'edit') {
        const stu = studentsCache.find(s => s.id === id);
        if (stu) editStudent(stu);
      } else if (action === 'delete') {
        deleteStudent(id);
      }
    });

    loadData();
  </script>
</body>
</html>
