<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Subject Management | Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #FFFFFF;
      color: #000000;
      display: flex;
      min-height: 100vh;
    }

    #sidebar-container {
      display: contents;
    }

    aside {
      width: 260px;
      background: #FFFFFF;
      border-right: 2px solid #0047AB;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      flex-shrink: 0;
    }

    .sidebar-brand h2 {
      font-size: 1.4rem;
      color: #0047AB;
      margin-bottom: 6px;
    }

    .sidebar-brand p {
      font-size: 0.85rem;
      color: #555555;
    }

    .sidebar-menu {
      list-style: none;
      margin-top: 30px;
      flex-grow: 1;
    }

    .sidebar-menu li {
      margin-bottom: 12px;
    }

    .sidebar-menu a {
      display: block;
      padding: 10px 14px;
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: #0047AB;
      color: #FFFFFF;
    }

    .logout-btn {
      display: block;
      padding: 10px 14px;
      background: #FFFFFF;
      color: #0047AB;
      border: 1px solid #0047AB;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #0047AB;
      color: #FFFFFF;
    }

    main {
      flex-grow: 1;
      padding: 30px 40px;
      background: #FFFFFF;
      overflow-y: auto;
      min-width: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 15px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #000000;
    }

    .admin-profile-badge {
      font-size: 0.9rem;
      color: #555555;
      font-weight: 600;
    }

    .section-title {
      font-size: 1.3rem;
      color: #000000;
      margin-bottom: 15px;
      font-weight: 600;
    }

    /* Course Cards Grid */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card-box {
      background: #FFFFFF;
      border: 2px solid #0047AB;
      border-radius: 12px;
      padding: 24px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 71, 171, 0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card-box:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0, 71, 171, 0.12);
      background: #f8fafc;
    }

    .card-box h3 {
      font-size: 1.3rem;
      color: #0047AB;
      margin-bottom: 8px;
    }

    .card-box p {
      color: #555555;
      font-size: 0.9rem;
      margin-bottom: 4px;
    }

    .empty-courses-notice {
      grid-column: 1 / -1;
      background: #f8fafc;
      border: 1px dashed #94a3b8;
      border-radius: 10px;
      padding: 24px;
      text-align: center;
      color: #475569;
    }

    .empty-courses-notice a {
      color: #0047AB;
      font-weight: 600;
      text-decoration: none;
    }

    .empty-courses-notice a:hover {
      text-decoration: underline;
    }

    .view-section {
      display: none;
    }
    .view-section.active {
      display: block;
    }

    .back-btn {
      background: #e2e8f0;
      color: #1e293b;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .back-btn:hover {
      background: #cbd5e1;
    }

    /* Semester Subject Section Box */
    .semester-box {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
      overflow-x: auto;
    }

    .semester-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .semester-header-row h4 {
      font-size: 1.2rem;
      color: #0047AB;
    }

    .add-subject-btn {
      padding: 8px 16px;
      background: #0047AB;
      color: #FFFFFF;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-subject-btn:hover {
      background: #003380;
    }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      background: #FFFFFF;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 16px;
      text-align: left;
      font-size: 0.85rem;
      border-bottom: 1px solid #e0e0e0;
    }

    th {
      background: #0047AB;
      color: #FFFFFF;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .edit-btn {
      padding: 4px 10px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-btn {
      padding: 4px 10px;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
    }

    .badge-type {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .badge-theory {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #7dd3fc;
    }
    .badge-practical {
      background: #f3e8ff;
      color: #7e22ce;
      border: 1px solid #d8b4fe;
    }

    .code-badge {
      background: #f1f5f9;
      color: #334155;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
      font-family: monospace;
      font-size: 0.8rem;
      border: 1px solid #cbd5e1;
    }

    /* Modal Popup */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease-in-out;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-card {
      background: #FFFFFF;
      border: 2px solid #0047AB;
      border-radius: 12px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 10px;
    }

    .modal-header h3 {
      font-size: 1.2rem;
      color: #0047AB;
    }

    .close-btn {
      background: transparent;
      border: none;
      font-size: 1.4rem;
      font-weight: bold;
      color: #555555;
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #000000;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #FFFFFF;
      color: #000000;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #0047AB;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-primary {
      padding: 10px 20px;
      background: #0047AB;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover {
      background: #003380;
    }
    .btn-primary:disabled {
      background: #7a9ad0;
      cursor: not-allowed;
    }
    .btn-secondary {
      padding: 10px 20px;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
    }
  </style>
</head>
<body>

  <!-- Admin Sidebar Insertion Point -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main>
    <header>
      <h1>Subject Management</h1>
      <div class="admin-profile-badge">Role: <span data-user="title"></span> | ID: <span data-user="id"></span></div>
    </header>

    <!-- STEP 1: Course Selection Boxes (loaded from database) -->
    <div id="courseGridView" class="view-section active">
      <div class="section-title">Select a Course to Manage Subjects</div>
      <div class="grid-container" id="coursesGrid"></div>
    </div>

    <!-- STEP 2: Semester-wise Subjects View -->
    <div id="semesterSubjectView" class="view-section">
      <button type="button" class="back-btn" id="backToCoursesBtn">&larr; Back to Courses</button>
      <div class="section-title" id="selectedCourseHeader">Semester Subjects</div>
      <div id="semesterContainersWrapper"></div>
    </div>
  </main>

  <!-- Add/Edit Subject Modal Popup -->
  <div class="modal-overlay" id="subjectModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Add Subject</h3>
        <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <form id="subjectForm">
        <div class="form-group">
          <label for="modalSemInfo">Selected Semester</label>
          <input type="text" id="modalSemInfo" readonly style="background: #f8fafc; font-weight: 600;">
        </div>
        <div class="form-group">
          <label for="modalSubjectCode">Subject Code</label>
          <input type="text" id="modalSubjectCode" placeholder="e.g. BCA-101" required>
        </div>
        <div class="form-group">
          <label for="modalSubjectName">Subject Name</label>
          <input type="text" id="modalSubjectName" placeholder="e.g. Data Structures & Algorithms" required>
        </div>
        <div class="form-group">
          <label for="modalCredits">Credits</label>
          <input type="number" id="modalCredits" min="1" max="10" value="4" required>
        </div>
        <div class="form-group">
          <label for="modalDuration">Duration (in Hours)</label>
          <input type="text" id="modalDuration" placeholder="e.g. 60 Hours" required>
        </div>
        <div class="form-group">
          <label for="modalType">Subject Type</label>
          <select id="modalType" required>
            <option value="Theory">Theory</option>
            <option value="Practical">Practical</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-primary" id="saveSubjectBtn">Confirm &amp; Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/components/portal.js"></script>
  <script>
    initPortal({ sidebar: '/components/admin-sidebar.html', role: 'admin', defaultPage: 'subject.html' });

    let coursesCache = [];
    let subjectsCache = [];
    let activeCourseCode = '';
    let activeSemester = 0;
    let editingId = null;
    const $ = id => document.getElementById(id);

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    async function api(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/auth/login.html';
        throw new Error('Session expired');
      }
      let data;
      try { data = await res.json(); }
      catch { throw new Error('Unexpected server response (' + res.status + ')'); }
      return data;
    }

    function getActiveCourse() {
      return coursesCache.find(c => c.course_code === activeCourseCode);
    }

    /* ---------- Data loading ---------- */
    async function loadData() {
      try {
        const [courseRes, subjectRes] = await Promise.all([
          api('/api/courses'),
          api('/api/subjects')
        ]);
        if (!courseRes.success) { alert(courseRes.message || 'Failed to load courses.'); return; }
        if (!subjectRes.success) { alert(subjectRes.message || 'Failed to load subjects.'); return; }

        coursesCache = courseRes.courses;
        subjectsCache = subjectRes.subjects;
        renderCourseCards();

        if (activeCourseCode) {
          if (getActiveCourse()) renderSemesters();
          else showCourseView();   // course was deleted/renamed elsewhere
        }
      } catch (err) {
        console.error('Error loading subject data:', err);
      }
    }

    /* ---------- Course cards ---------- */
    function renderCourseCards() {
      const grid = $('coursesGrid');
      if (!coursesCache.length) {
        grid.innerHTML = `
          <div class="empty-courses-notice">
            No courses have been created yet. Please go to <a href="courses.html">Course Catalog</a> to add a course first.
          </div>`;
        return;
      }
      grid.innerHTML = coursesCache.map(c => {
        const count = subjectsCache.filter(s => s.course_code === c.course_code).length;
        return `
          <div class="card-box" data-course="${esc(c.course_code)}">
            <h3>${esc(c.course_code)}</h3>
            <p>${esc(c.course_name)}</p>
            <p><strong>${esc(c.total_semesters)} Semesters</strong> (${esc(c.duration)}) &bull; ${count} Subject${count === 1 ? '' : 's'}</p>
          </div>`;
      }).join('');
    }

    function showCourseView() {
      activeCourseCode = '';
      $('semesterSubjectView').classList.remove('active');
      $('courseGridView').classList.add('active');
    }

    function selectCourse(courseCode) {
      activeCourseCode = courseCode;
      const course = getActiveCourse();
      if (!course) return;
      $('selectedCourseHeader').textContent =
        `Subject Directory for ${course.course_code} (${course.course_name})`;
      renderSemesters();
      $('courseGridView').classList.remove('active');
      $('semesterSubjectView').classList.add('active');
    }

    /* ---------- Semester boxes ---------- */
    function renderSemesters() {
      const course = getActiveCourse();
      const wrapper = $('semesterContainersWrapper');
      wrapper.innerHTML = '';
      if (!course) return;

      const totalSems = Number(course.total_semesters);

      for (let s = 1; s <= totalSems; s++) {
        const semSubjects = subjectsCache.filter(
          sub => sub.course_code === course.course_code && Number(sub.semester) === s
        );

        let tableRows = '';
        if (!semSubjects.length) {
          tableRows = `<tr><td colspan="6" style="text-align:center;color:#666;font-style:italic;">No subjects added for Semester ${s} yet. Click "Add Subject" above.</td></tr>`;
        } else {
          tableRows = semSubjects.map(sub => {
            const badgeClass = sub.subject_type === 'Theory' ? 'badge-theory' : 'badge-practical';
            return `
              <tr>
                <td><span class="code-badge">${esc(sub.subject_code)}</span></td>
                <td><strong>${esc(sub.subject_name)}</strong></td>
                <td>${esc(sub.credits)}</td>
                <td>${esc(sub.duration)}</td>
                <td><span class="badge-type ${badgeClass}">${esc(sub.subject_type)}</span></td>
                <td>
                  <div class="action-btns">
                    <button type="button" class="edit-btn" data-action="edit" data-id="${sub.id}">Edit</button>
                    <button type="button" class="delete-btn" data-action="delete" data-id="${sub.id}">Delete</button>
                  </div>
                </td>
              </tr>`;
          }).join('');
        }

        const semBox = document.createElement('div');
        semBox.className = 'semester-box';
        semBox.innerHTML = `
          <div class="semester-header-row">
            <h4>Semester ${s} (${semSubjects.length} Subject${semSubjects.length === 1 ? '' : 's'})</h4>
            <button type="button" class="add-subject-btn" data-action="add" data-sem="${s}">+ Add Subject</button>
          </div>
          <table>
            <thead>
              <tr>
                <th>Subject Code</th>
                <th>Subject Name</th>
                <th>Credits</th>
                <th>Duration</th>
                <th>Type</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>${tableRows}</tbody>
          </table>`;
        wrapper.appendChild(semBox);
      }
    }

    /* ---------- Modal ---------- */
    function openAddModal(semester) {
      activeSemester = semester;
      editingId = null;
      $('modalTitle').textContent = `Add Subject to ${activeCourseCode} - Semester ${semester}`;
      $('modalSemInfo').value = `${activeCourseCode} | Semester ${semester}`;
      $('modalSubjectCode').value = '';
      $('modalSubjectName').value = '';
      $('modalCredits').value = '4';
      $('modalDuration').value = '';
      $('modalType').selectedIndex = 0;
      $('subjectModal').classList.add('active');
    }

    function openEditModal(sub) {
      activeSemester = Number(sub.semester);
      editingId = sub.id;
      $('modalTitle').textContent = `Edit Subject (${activeCourseCode} - Semester ${sub.semester})`;
      $('modalSemInfo').value = `${activeCourseCode} | Semester ${sub.semester}`;
      $('modalSubjectCode').value = sub.subject_code;
      $('modalSubjectName').value = sub.subject_name;
      $('modalCredits').value = sub.credits;
      $('modalDuration').value = sub.duration;
      $('modalType').value = sub.subject_type;
      $('subjectModal').classList.add('active');
    }

    function closeSubjectModal() {
      $('subjectModal').classList.remove('active');
      editingId = null;
    }

    async function handleSubjectSubmit(event) {
      event.preventDefault();

      const payload = {
        course_code: activeCourseCode,
        semester: activeSemester,
        subject_code: $('modalSubjectCode').value.trim(),
        subject_name: $('modalSubjectName').value.trim(),
        credits: $('modalCredits').value,
        duration: $('modalDuration').value.trim(),
        subject_type: $('modalType').value
      };

      if (!payload.subject_code || !payload.subject_name || !payload.duration) {
        alert('Please fill in all subject fields.');
        return;
      }

      const btn = $('saveSubjectBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const url = editingId ? `/api/subjects/${editingId}` : '/api/subjects';
        const result = await api(url, {
          method: editingId ? 'PUT' : 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (result.success) {
          alert(result.message);
          closeSubjectModal();
          await loadData();
        } else {
          alert(result.message || 'Operation failed.');
        }
      } catch (err) {
        console.error('Error saving subject:', err);
        alert(err.message || 'Server communication error.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirm & Save';
      }
    }

    async function deleteSubject(id) {
      const sub = subjectsCache.find(s => s.id === id);
      const label = sub ? sub.subject_code : 'this subject';
      if (!confirm(`Are you sure you want to delete subject code "${label}"?`)) return;
      try {
        const result = await api(`/api/subjects/${id}`, { method: 'DELETE' });
        if (result.success) await loadData();
        else alert(result.message || 'Failed to delete subject.');
      } catch (err) {
        console.error('Error deleting subject:', err);
        alert(err.message);
      }
    }

    /* ---------- Events ---------- */
    $('coursesGrid').addEventListener('click', e => {
      const card = e.target.closest('.card-box[data-course]');
      if (card) selectCourse(card.dataset.course);
    });

    $('backToCoursesBtn').addEventListener('click', showCourseView);
    $('closeModalBtn').addEventListener('click', closeSubjectModal);
    $('cancelModalBtn').addEventListener('click', closeSubjectModal);
    $('subjectForm').addEventListener('submit', handleSubjectSubmit);

    $('semesterContainersWrapper').addEventListener('click', e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      if (action === 'add') {
        openAddModal(Number(btn.dataset.sem));
      } else if (action === 'edit') {
        const sub = subjectsCache.find(s => s.id === Number(btn.dataset.id));
        if (sub) openEditModal(sub);
      } else if (action === 'delete') {
        deleteSubject(Number(btn.dataset.id));
      }
    });

    loadData();
  </script>
</body>
</html>
