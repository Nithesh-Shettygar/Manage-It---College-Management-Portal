<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Faculty Management | Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #FFFFFF;
      color: #000000;
      display: flex;
      min-height: 100vh;
    }

    #sidebar-container {
      display: contents;
    }

    aside {
      width: 260px;
      background: #FFFFFF;
      border-right: 2px solid #0047AB;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
      flex-shrink: 0;
    }

    .sidebar-brand h2 {
      font-size: 1.4rem;
      color: #0047AB;
      margin-bottom: 6px;
    }

    .sidebar-brand p {
      font-size: 0.85rem;
      color: #555555;
    }

    .sidebar-menu {
      list-style: none;
      margin-top: 30px;
      flex-grow: 1;
    }

    .sidebar-menu li {
      margin-bottom: 12px;
    }

    .sidebar-menu a {
      display: block;
      padding: 10px 14px;
      color: #000000;
      text-decoration: none;
      font-weight: 500;
      border-radius: 8px;
      transition: background 0.2s, color 0.2s;
    }

    .sidebar-menu a:hover, .sidebar-menu a.active {
      background: #0047AB;
      color: #FFFFFF;
    }

    .logout-btn {
      display: block;
      padding: 10px 14px;
      background: #FFFFFF;
      color: #0047AB;
      border: 1px solid #0047AB;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: #0047AB;
      color: #FFFFFF;
    }

    main {
      flex-grow: 1;
      padding: 30px 40px;
      background: #FFFFFF;
      overflow-y: auto;
      min-width: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 15px;
    }

    header h1 {
      font-size: 1.8rem;
      color: #000000;
    }

    .admin-profile-badge {
      font-size: 0.9rem;
      color: #555555;
      font-weight: 600;
    }

    /* Form Container Card */
    .form-card {
      background: #FFFFFF;
      border: 2px solid #0047AB;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 35px;
      box-shadow: 0 4px 12px rgba(0, 71, 171, 0.06);
    }

    .form-card h3 {
      font-size: 1.2rem;
      color: #0047AB;
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #000000;
      margin-bottom: 6px;
    }

    .form-group input, .form-group select {
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      background: #FFFFFF;
      color: #000000;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #0047AB;
    }

    .form-group input:disabled {
      background: #f1f5f9;
      color: #64748b;
      cursor: not-allowed;
    }

    .btn-primary {
      padding: 10px 24px;
      background: #0047AB;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background: #003380;
    }

    .btn-primary:disabled {
      background: #7a9ad0;
      cursor: not-allowed;
    }

    .form-submit-container {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn-secondary {
      padding: 10px 20px;
      background: #e2e8f0;
      color: #1e293b;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }

    .btn-secondary:hover {
      background: #cbd5e1;
    }

    /* Tables */
    .section-title {
      font-size: 1.3rem;
      color: #000000;
      margin-bottom: 15px;
      font-weight: 600;
    }

    .table-wrap {
      overflow-x: auto;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #FFFFFF;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 14px 16px;
      text-align: left;
      font-size: 0.9rem;
      border-bottom: 1px solid #e0e0e0;
      white-space: nowrap;
    }

    th {
      background: #0047AB;
      color: #FFFFFF;
      font-weight: 600;
    }

    tr:nth-child(even) {
      background: #f8fafc;
    }

    tr:hover {
      background: #f1f5f9;
    }

    .faculty-photo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #0047AB;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .edit-btn {
      padding: 6px 12px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #93c5fd;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .edit-btn:hover {
      background: #dbeafe;
    }

    .delete-btn {
      padding: 6px 12px;
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #f87171;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .delete-btn:hover {
      background: #fecaca;
    }
  </style>
</head>
<body>

  <!-- Admin Sidebar Insertion Point -->
  <div id="sidebar-container"></div>

  <!-- Main Content -->
  <main>
    <header>
      <h1>Faculty Management</h1>
      <div class="admin-profile-badge">Role: <span data-user="title"></span> | ID: <span data-user="id"></span></div>
    </header>

    <!-- Add / Edit Faculty Form Card -->
    <div class="form-card">
      <h3 id="formTitle">Add New Faculty Member</h3>
      <input type="hidden" id="editingId" value="">
      <div class="form-grid">
        <div class="form-group">
          <label for="facultyEmpId">Employee ID</label>
          <input type="text" id="facultyEmpId" placeholder="e.g. FAC105">
        </div>
        <div class="form-group">
          <label for="facultyPassword">Login Password</label>
          <input type="password" id="facultyPassword" placeholder="Set temporary password" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label for="facultyName">Full Name</label>
          <input type="text" id="facultyName" placeholder="e.g. Dr. Robert Vance">
        </div>
        <div class="form-group">
          <label for="facultyDesignation">Designation</label>
          <select id="facultyDesignation">
            <option value="Professor">Professor</option>
            <option value="Associate Professor">Associate Professor</option>
            <option value="Assistant Professor">Assistant Professor</option>
            <option value="Lecturer">Lecturer</option>
          </select>
        </div>
        <div class="form-group">
          <label for="facultyGender">Gender</label>
          <select id="facultyGender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label for="facultyEmail">Email Address</label>
          <input type="email" id="facultyEmail" placeholder="e.g. robert.vance@portal.edu">
        </div>
        <div class="form-group">
          <label for="facultyPhone">Phone Number</label>
          <input type="text" id="facultyPhone" placeholder="e.g. +91 98765 43210">
        </div>
        <div class="form-group">
          <label for="facultyDob">Date of Birth</label>
          <input type="date" id="facultyDob" value="1980-06-15">
        </div>
        <div class="form-group">
          <label for="facultyEdu">Educational Qualification</label>
          <input type="text" id="facultyEdu" placeholder="e.g. Ph.D. in Computer Science">
        </div>
        <div class="form-group">
          <label for="facultyPhoto">Photo (optional)</label>
          <input type="file" id="facultyPhoto" accept="image/*">
        </div>
      </div>
      <div class="form-submit-container">
        <button type="button" class="btn-secondary" id="cancelBtn">Cancel</button>
        <button type="button" class="btn-primary" id="submitBtn">Add Faculty</button>
      </div>
    </div>

    <!-- Active Faculty Directory Table -->
    <div class="section-title">Active Faculty Directory</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Designation</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Phone</th>
            <th>DOB</th>
            <th>Qualification</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="facultyTableBody"></tbody>
      </table>
    </div>
  </main>

  <script src="/components/portal.js"></script>
  <script>
    initPortal({ sidebar: '/components/admin-sidebar.html', role: 'admin', defaultPage: 'faculty.html' });

    const FALLBACK_PHOTO = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"><rect width="40" height="40" fill="#dbe7f7"/>' +
      '<circle cx="20" cy="15" r="7" fill="#0047AB"/><rect x="8" y="25" width="24" height="12" rx="6" fill="#0047AB"/></svg>');

    let facultyCache = [];
    const $ = id => document.getElementById(id);

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    const show = v => (v === null || v === undefined || v === '') ? '-' : esc(v);

    async function api(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/auth/login.html';
        throw new Error('Session expired');
      }
      let data;
      try { data = await res.json(); }
      catch { throw new Error('Unexpected server response (' + res.status + ')'); }
      return data;
    }

    async function loadFacultyList() {
      const tbody = $('facultyTableBody');
      try {
        const data = await api('/api/faculty');
        if (!data.success) { alert(data.message || 'Failed to load faculty.'); return; }
        facultyCache = data.faculty;

        if (!facultyCache.length) {
          tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:#666;">No faculty members found.</td></tr>';
          return;
        }

        tbody.innerHTML = facultyCache.map(f => {
          const photo = (f.photo && !f.photo.includes('via.placeholder.com')) ? f.photo : FALLBACK_PHOTO;
          return `
            <tr>
              <td><img src="${esc(photo)}" alt="Photo" class="faculty-photo"></td>
              <td><code>${show(f.employee_id)}</code></td>
              <td><strong>${show(f.full_name)}</strong></td>
              <td>${show(f.designation)}</td>
              <td>${show(f.gender)}</td>
              <td>${show(f.email)}</td>
              <td>${show(f.phone)}</td>
              <td>${show(f.dob)}</td>
              <td>${show(f.qualification)}</td>
              <td>
                <div class="action-btns">
                  <button type="button" class="edit-btn" data-action="edit" data-id="${f.id}">Edit</button>
                  <button type="button" class="delete-btn" data-action="delete" data-id="${f.id}">Delete</button>
                </div>
              </td>
            </tr>`;
        }).join('');
      } catch (err) {
        console.error('Error loading faculty list:', err);
      }
    }

    async function saveFaculty() {
      const editingId = $('editingId').value;
      const employee_id = $('facultyEmpId').value.trim();
      const password = $('facultyPassword').value.trim();
      const full_name = $('facultyName').value.trim();
      const email = $('facultyEmail').value.trim();

      if (!employee_id || !full_name || !email || (!editingId && !password)) {
        alert('Please fill in Employee ID, Password, Full Name, and Email.');
        return;
      }
      if (!/^\S+@\S+\.\S+$/.test(email)) {
        alert('Please enter a valid email address.');
        return;
      }

      const fd = new FormData();
      fd.append('employee_id', employee_id);
      fd.append('password', password);
      fd.append('full_name', full_name);
      fd.append('designation', $('facultyDesignation').value);
      fd.append('gender', $('facultyGender').value);
      fd.append('email', email);
      fd.append('phone', $('facultyPhone').value.trim());
      fd.append('dob', $('facultyDob').value);
      fd.append('qualification', $('facultyEdu').value.trim());
      const photo = $('facultyPhoto').files[0];
      if (photo) fd.append('photo', photo);

      const btn = $('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        const url = editingId ? `/api/faculty/${editingId}` : '/api/faculty';
        const result = await api(url, { method: editingId ? 'PUT' : 'POST', body: fd });
        if (result.success) {
          alert(result.message);
          resetForm();
          loadFacultyList();
        } else {
          alert(result.message || 'Operation failed.');
        }
      } catch (err) {
        console.error('Error saving faculty:', err);
        alert(err.message || 'Server communication error.');
      } finally {
        btn.disabled = false;
        btn.textContent = $('editingId').value ? 'Update Faculty' : 'Add Faculty';
      }
    }

    function editFaculty(fac) {
      $('editingId').value = fac.id;
      $('facultyEmpId').value = fac.employee_id || '';
      $('facultyEmpId').disabled = true;           // ID can't change on edit
      $('facultyPassword').value = '';
      $('facultyPassword').placeholder = 'Leave blank to keep existing password';
      $('facultyName').value = fac.full_name || '';
      $('facultyDesignation').value = fac.designation || 'Professor';
      $('facultyGender').value = fac.gender || 'Male';
      $('facultyEmail').value = fac.email || '';
      $('facultyPhone').value = fac.phone || '';
      $('facultyDob').value = fac.dob || '';
      $('facultyEdu').value = fac.qualification || '';
      $('facultyPhoto').value = '';

      $('formTitle').textContent = 'Edit Faculty Member';
      $('submitBtn').textContent = 'Update Faculty';
      $('cancelBtn').style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteFaculty(facId) {
      if (!confirm('Are you sure you want to delete this faculty member?')) return;
      try {
        const result = await api(`/api/faculty/${facId}`, { method: 'DELETE' });
        if (result.success) loadFacultyList();
        else alert(result.message || 'Failed to delete.');
      } catch (err) {
        console.error('Error deleting faculty:', err);
        alert(err.message);
      }
    }

    function resetForm() {
      $('editingId').value = '';
      $('facultyEmpId').value = '';
      $('facultyEmpId').disabled = false;
      $('facultyPassword').value = '';
      $('facultyPassword').placeholder = 'Set temporary password';
      $('facultyName').value = '';
      $('facultyDesignation').selectedIndex = 0;
      $('facultyGender').selectedIndex = 0;
      $('facultyEmail').value = '';
      $('facultyPhone').value = '';
      $('facultyDob').value = '1980-06-15';
      $('facultyEdu').value = '';
      $('facultyPhoto').value = '';

      $('formTitle').textContent = 'Add New Faculty Member';
      $('submitBtn').textContent = 'Add Faculty';
      $('cancelBtn').style.display = 'none';
    }

    // Wire up events
    $('submitBtn').addEventListener('click', saveFaculty);
    $('cancelBtn').addEventListener('click', resetForm);
    $('facultyTableBody').addEventListener('click', e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      if (btn.dataset.action === 'edit') {
        const fac = facultyCache.find(f => f.id === id);
        if (fac) editFaculty(fac);
      } else if (btn.dataset.action === 'delete') {
        deleteFaculty(id);
      }
    });

    loadFacultyList();
  </script>
</body>
</html>
