<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage It – Portal Home</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #FFFFFF;
      color: #000000;
      padding: 20px;
    }

    /* ---------- Opening animation ---------- */
    .intro {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #0047AB;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      animation: curtain 0.9s cubic-bezier(.77, 0, .18, 1) 2.9s forwards;
    }
    .intro-title {
      display: flex;
      gap: 0.06em;
      font-size: clamp(3rem, 12vw, 7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      line-height: 1;
    }
    .intro-title .mask { display: inline-block; overflow: hidden; padding: 0.08em 0; }
    .intro-title .ch {
      display: inline-block;
      transform: translateY(110%);
      animation: rise 0.7s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(0.25s + var(--i) * 0.07s);
    }
    .intro-title .gap { width: 0.3em; }
    .intro-line {
      height: 3px;
      width: 0;
      background: #FFFFFF;
      animation: draw 0.9s cubic-bezier(.6, 0, .2, 1) 1.4s forwards;
    }
    .intro-tag {
      color: #FFFFFF;
      font-size: 1rem;
      opacity: 0;
      animation: fade 0.6s ease 2.0s forwards;
    }

    @keyframes rise   { to { transform: translateY(0); } }
    @keyframes draw   { to { width: min(320px, 60vw); } }
    @keyframes fade   { to { opacity: 0.9; } }
    @keyframes curtain {
      to { transform: translateY(-100%); visibility: hidden; }
    }

    /* ---------- Page content ---------- */
    .card {
      background: #FFFFFF;
      color: #000000;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 71, 171, 0.1);
      text-align: center;
      max-width: 480px;
      width: 100%;
      border: 2px solid #0047AB;
      opacity: 0;
      transform: translateY(24px);
      animation: card-in 0.8s cubic-bezier(.2, .8, .2, 1) 3.3s forwards;
    }
    .brand { color: #0047AB; font-weight: 700; font-size: 1rem; margin-bottom: 10px; }
    h1 { font-size: 2.2rem; color: #000000; margin-bottom: 12px; }
    p { color: #444444; font-size: 1rem; margin-bottom: 28px; line-height: 1.5; }
    .btn {
      display: inline-block;
      padding: 12px 32px;
      background: #0047AB;
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover { background: #003380; transform: translateY(-2px); }
    .btn:focus-visible { outline: 3px solid #000000; outline-offset: 3px; }

    @keyframes card-in { to { opacity: 1; transform: translateY(0); } }

    /* ---------- Reduced motion: skip the intro ---------- */
    @media (prefers-reduced-motion: reduce) {
      .intro { display: none; }
      .card { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>

  <div class="intro" aria-hidden="true">
    <div class="intro-title">
      <span class="mask"><span class="ch" style="--i:0">M</span></span>
      <span class="mask"><span class="ch" style="--i:1">a</span></span>
      <span class="mask"><span class="ch" style="--i:2">n</span></span>
      <span class="mask"><span class="ch" style="--i:3">a</span></span>
      <span class="mask"><span class="ch" style="--i:4">g</span></span>
      <span class="mask"><span class="ch" style="--i:5">e</span></span>
      <span class="gap"></span>
      <span class="mask"><span class="ch" style="--i:6">I</span></span>
      <span class="mask"><span class="ch" style="--i:7">t</span></span>
    </div>
    <div class="intro-line"></div>
    <div class="intro-tag">Students · Faculty · Administrators</div>
  </div>

  <main class="card">
    <div class="brand">Manage It</div>
    <h1>Welcome to the Institutional Portal</h1>
    <p>Access customized dashboards and resources for Students, Faculty, and Administrators.</p>
    <a href="/auth/login.html" class="btn">Go to Login</a>
  </main>

</body>
</html>
