<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #FFFFFF; /* Pure White background */
      padding: 20px;
    }

    .login-container {
      background: #FFFFFF;
      width: 100%;
      max-width: 420px;
      padding: 35px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 71, 171, 0.12);
      border: 2px solid #0047AB; /* Vibrant Cobalt Blue border */
    }

    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-header h2 {
      color: #000000;
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    .login-header p {
      color: #555555;
      font-size: 0.9rem;
    }

    /* Role Switcher Segmented Control */
    .role-switcher {
      position: relative;
      display: flex;
      background: #f0f4f8;
      border-radius: 30px;
      padding: 4px;
      margin-bottom: 25px;
      border: 1px solid #d0d7de;
    }

    .role-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 0;
      font-size: 0.88rem;
      font-weight: 600;
      color: #555555;
      cursor: pointer;
      z-index: 2;
      transition: color 0.3s ease;
    }

    .role-btn.active {
      color: #0047AB;
    }

    .glider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc((100% - 8px) / 3);
      height: calc(100% - 8px);
      background: #FFFFFF;
      border-radius: 25px;
      box-shadow: 0 2px 8px rgba(0, 71, 171, 0.2);
      border: 1px solid #0047AB;
      transition: transform 0.3s ease-in-out;
      z-index: 1;
    }

    /* Inputs & Form */
    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #000000;
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cccccc;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      background: #FFFFFF;
      color: #000000;
    }

    .input-group input:focus {
      border-color: #0047AB;
      box-shadow: 0 0 0 3px rgba(0, 71, 171, 0.15);
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }

    .remember-me {
      color: #333333;
      cursor: pointer;
    }

    .forgot-link {
      color: #0047AB;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      background: #0047AB;
      color: #FFFFFF;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .submit-btn:hover {
      background: #003380;
    }

    .submit-btn:disabled {
      background: #7a9ad0;
      cursor: not-allowed;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #555555;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .back-home:hover {
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Select your account type to continue</p>
    </div>

    <!-- Role Switcher -->
    <div class="role-switcher">
      <div class="glider" id="glider"></div>
      <button type="button" class="role-btn active" data-role="student">Student</button>
      <button type="button" class="role-btn" data-role="faculty">Faculty</button>
      <button type="button" class="role-btn" data-role="admin">Admin</button>
    </div>

    <!-- Form -->
    <form id="loginForm">
      <div class="input-group">
        <label for="username" id="idLabel">Student ID / Roll No</label>
        <input type="text" id="username" placeholder="e.g. STU12345" required autocomplete="username">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div class="form-actions">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
      
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Login as Student</button>
      <a href="/index.html" class="back-home">← Back to Home</a>
    </form>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const roleBtns = document.querySelectorAll(".role-btn");
      const glider = document.getElementById("glider");
      const idLabel = document.getElementById("idLabel");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const submitBtn = document.getElementById("submitBtn");
      const loginForm = document.getElementById("loginForm");

      let currentRole = "student";

      // Role-specific labels, placeholders and button text
      const roleConfig = {
        student: {
          label: "Student ID / Roll No",
          placeholder: "e.g. STU12345",
          btnText: "Login as Student",
          transform: "translateX(0%)"
        },
        faculty: {
          label: "Faculty Employee ID",
          placeholder: "e.g. FAC104",
          btnText: "Login as Faculty",
          transform: "translateX(100%)"
        },
        admin: {
          label: "Admin Username",
          placeholder: "e.g. admin",
          btnText: "Login as Admin",
          transform: "translateX(200%)"
        }
      };

      // Where each role lands after a successful login (absolute paths)
      const roleRoutes = {
        student: "/student/view.html",
        faculty: "/faculty/home.html",
        admin: "/admin/dashboard.html"
      };

      // Role switcher
      roleBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          const selectedRole = btn.getAttribute("data-role");

          roleBtns.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          const config = roleConfig[selectedRole];
          glider.style.transform = config.transform;
          idLabel.textContent = config.label;
          usernameInput.placeholder = config.placeholder;
          submitBtn.textContent = config.btnText;

          currentRole = selectedRole;
          usernameInput.focus();
        });
      });

      // Authenticate with the Flask backend, then redirect by role
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = usernameInput.value.trim();
        const password = passwordInput.value.trim();
        const originalText = submitBtn.textContent;

        submitBtn.disabled = true;
        submitBtn.textContent = "Logging in...";

        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: `role=${encodeURIComponent(currentRole)}&username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`
          });

          const result = await response.json();

          if (response.ok && result.success) {
            // Use the role confirmed by the server
            const target = roleRoutes[result.role] || roleRoutes[currentRole];
            window.location.href = target;
          } else {
            alert(result.message || "Login failed. Please check your credentials.");
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        } catch (err) {
          console.error("Login error:", err);
          alert("An error occurred connecting to the server.");
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });
    });
  </script>
</body>
</html>
